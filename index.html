<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Shopping</title>
<link rel="icon" type="image/x-icon" href="images/web-icon.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<nav class="navbar">
<div class="logo">
Tech Shopping
</div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Categories</a></li>
<li><a href="#">Contact</a></li>
</ul>

<div class="icons">
<i class="fas fa-search"></i>
<i class="fas fa-shopping-cart"></i>
<i class="fas fa-user"></i>
</div>

</nav>

<div class="hero">

<div class="hero-content">
<h1>Discover Your Style</h1>

<p>
Premium Products at Amazing Prices
</p>

<button>Shop Now</button>
</div>

</div>

</header>

<section class="products">

<h2>Featured Products</h2>

<div class="product-grid">

<div class="product-card">
<img src="images/Nike-shoes.webp" alt="">
<h3>Nike Shoes</h3>
<p>₹499</p>
<button>Add to Cart</button>
</div>

<div class="product-card">
<img src="images/smart watch.jpg" alt="">
<h3>Smart Watch</h3>
<p>₹1499</p>
<button>Add to Cart</button>
</div>

<div class="product-card">
<img src="images/iphone.jpg" alt="">
<h3>iPhone</h3>
<p>₹1,25,000</p>
<button>Add to Cart</button>
</div>

<div class="product-card">
<img src="images/headphone.webp" alt="">
<h3>Headphones</h3>
<p>₹2999</p>
<button>Add to Cart</button>
</div>

</div>

</section>

<footer>

<h3>ShopVerse</h3>

<p>
© 2026 All Rights Reserved
</p>

</footer>

<script src="script.js"></script>

</body>
</html>
